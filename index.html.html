<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホ画面にぴったりフィットさせる設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>わくわくじゃんけん - ステップ2</title>

  <!-- MediaPipe Hands & カメラライブラリ（CDN）の読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    /* --- 全体の基本スタイル --- */
    body {
      /* パステルイエローの背景色 */
      background-color: #FFF9E6; 
      font-family: 'Arial Rounded MT Bold', 'ヒラギノ丸ゴ ProN', sans-serif;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      box-sizing: border-box;
      user-select: none;
    }

    /* --- 1. 上部：対戦相手（動物）エリア --- */
    .character-area {
      text-align: center;
      margin-top: 10px;
    }
    
    .character-emoji {
      font-size: 80px; 
      line-height: 1;
      margin: 0;
    }

    .message-box {
      background-color: #FFFFFF;
      border: 3px solid #FF9999; 
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 18px;
      font-weight: bold;
      color: #FF5555;
      display: inline-block;
      margin-top: 5px;
    }

    /* --- 2. 中央：カメラ映像 ＆ 骨格描画エリア --- */
    .camera-container {
      width: 100%;
      max-width: 320px;
      height: 240px;
      background-color: #E0E0E0;
      border: 6px solid #FFD166;
      border-radius: 25px;
      overflow: hidden;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .camera-placeholder {
      color: #666;
      font-size: 16px;
      font-weight: bold;
      position: absolute;
    }

    /* カメラ映像（元の映像は裏で保持・非表示） */
    #webcam {
      display: none;
    }

    /* 骨格を描画するCanvas（重なるように絶対配置） */
    #output-canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* 鏡のように左右反転させる設定（自撮りモード用） */
      transform: scaleX(-1); 
      display: none;
    }

    /* --- 3. 下部：スタートボタンエリア --- */
    .btn-container {
      width: 100%;
      max-width: 300px;
      margin-bottom: 20px;
      text-align: center;
    }

    .start-btn {
      width: 100%;
      padding: 18px 0;
      font-size: 24px;
      font-weight: bold;
      color: #FFFFFF;
      background-color: #FF477E; 
      border: none;
      border-bottom: 6px solid #D62828; 
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: all 0.1s ease;
    }

    .start-btn:active {
      transform: translateY(4px);
      border-bottom: 2px solid #D62828;
    }
  </style>
</head>
<body>

  <!-- 1. 上部：動物エリア -->
  <div class="character-area">
    <div class="character-emoji">🐻</div>
    <div class="message-box" id="message">てを かざしてみてね！</div>
  </div>

  <!-- 2. 中央：カメラ・Canvasエリア -->
  <div class="camera-container">
    <div class="camera-placeholder" id="placeholder">ボタンを おしてね！</div>
    <!-- 内部で映像処理用のvideoタグ（画面には直接出しません） -->
    <video id="webcam" playsinline muted></video>
    <!-- カメラ映像＋骨格を描画するCanvas -->
    <canvas id="output-canvas" width="320" height="240"></canvas>
  </div>

  <!-- 3. 下部：ボタンエリア -->
  <div class="btn-container">
    <button class="start-btn" id="start-btn">スタート</button>
  </div>

  <!-- --- JavaScript：MediaPipe Hand ＆ 描画処理 --- -->
  <script>
    const startBtn = document.getElementById('start-btn');
    const webcam = document.getElementById('webcam');
    const canvasElement = document.getElementById('output-canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const placeholder = document.getElementById('placeholder');
    const message = document.getElementById('message');

    let camera = null;

    // 手の関節（21点）を結ぶ線の接続ペアを定義
    const HAND_CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,4],        // 親指
      [0,5],[5,6],[6,7],[7,8],        // 人差し指
      [5,9],[9,10],[10,11],[11,12],   // 中指
      [9,13],[13,14],[14,15],[15,16], // 薬指
      [13,17],[0,17],[17,18],[18,19],[19,20] // 小指・手首
    ];

    // --- 1. MediaPipe Handsのセットアップ ---
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,             // 検知する手の最大数（1人用なので1）
      modelComplexity: 1,         // 精度のバランス（0:軽さ優先, 1:標準）
      minDetectionConfidence: 0.5, // 検出の信頼度閾値
      minTrackingConfidence: 0.5   // 追跡の信頼度閾値
    });

    // --- 2. 手が検出されたときの描画処理 ---
    hands.onResults((results) => {
      // Canvasを一度クリア
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      // まず背景にカメラ映像を描画
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      // 手が検出されている場合のみ骨格を描画
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        for (const landmarks of results.multiHandLandmarks) {
          
          // A. 骨格の線を描画（明るいピンク色）
          canvasCtx.strokeStyle = '#FF3399'; // /* ここで線の色を変更 */
          canvasCtx.lineWidth = 5;           // /* ここで線の太さを変更 */
          canvasCtx.lineCap = 'round';

          for (const connection of HAND_CONNECTIONS) {
            const from = landmarks[connection[0]];
            const to = landmarks[connection[1]];
            canvasCtx.beginPath();
            canvasCtx.moveTo(from.x * canvasElement.width, from.y * canvasElement.height);
            canvasCtx.lineTo(to.x * canvasElement.width, to.y * canvasElement.height);
            canvasCtx.stroke();
          }

          // B. 関節の点（ドット）を描画（明るい黄色）
          canvasCtx.fillStyle = '#FFEA00'; // /* ここで点のプロパティを変更 */
          for (const landmark of landmarks) {
            canvasCtx.beginPath();
            canvasCtx.arc(
              landmark.x * canvasElement.width,
              landmark.y * canvasElement.height,
              6, // /* ここで点の大きさを変更 */
              0,
              2 * Math.PI
            );
            canvasCtx.fill();
            // 点のフチ取り（くっきり見せるため）
            canvasCtx.strokeStyle = '#FFFFFF';
            canvasCtx.lineWidth = 2;
            canvasCtx.stroke();
          }
        }
      }

      canvasCtx.restore();
    });

    // --- 3. スタートボタンを押したときの起動処理 ---
    startBtn.addEventListener('click', async () => {
      if (camera) return; // すでに起動している場合はスキップ

      try {
        // MediaPipe付属のCameraユーティリティでインカメラを起動
        camera = new Camera(webcam, {
          onFrame: async () => {
            await hands.send({ image: webcam });
          },
          width: 320,
          height: 240,
          facingMode: 'user'
        });

        await camera.start();

        // 表示の切り替え
        placeholder.style.display = 'none';
        canvasElement.style.display = 'block';

        message.textContent = '手がうつっているよ！';
        startBtn.textContent = 'カメラ起動中';
        startBtn.style.opacity = '0.7';

      } catch (error) {
        console.error('MediaPipe / カメラの起動に失敗しました:', error);
        alert('カメラの起動またはAIライブラリの読み込みに失敗しました。ネットワーク接続やブラウザ権限を確認してください。');
      }
    });
  </script>
</body>
</html>
