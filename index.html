<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホ画面にぴったりフィットさせる設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>わくわくじゃんけん - ステップ3</title>

  <!-- MediaPipe Hands & カメラライブラリ（CDN）の読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    /* --- 全体の基本スタイル --- */
    body {
      background-color: #FFF9E6; /* パステルイエローの背景色 */
      font-family: 'Arial Rounded MT Bold', 'ヒラギノ丸ゴ ProN', sans-serif;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      box-sizing: border-box;
      user-select: none;
      overflow: hidden; /* 紙吹雪が画面外にはみ出してもスクロールさせない */
      position: relative;
    }

    /* --- 1. 上部：対戦相手（クマ）エリア --- */
    .character-area {
      text-align: center;
      margin-top: 5px;
      z-index: 2;
    }
    
    .character-emoji {
      font-size: 70px; 
      line-height: 1;
      margin: 0;
      transition: transform 0.2s ease;
    }

    .enemy-hand-display {
      font-size: 40px;
      height: 45px;
      margin-top: -5px;
    }

    .message-box {
      background-color: #FFFFFF;
      border: 3px solid #FF9999; 
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 18px;
      font-weight: bold;
      color: #FF5555;
      display: inline-block;
      margin-top: 5px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }

    /* --- 2. 中央：カメラ映像 ＆ 骨格描画エリア --- */
    .camera-container {
      width: 100%;
      max-width: 300px;
      height: 220px;
      background-color: #E0E0E0;
      border: 6px solid #FFD166;
      border-radius: 25px;
      overflow: hidden;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    .camera-placeholder {
      color: #666;
      font-size: 16px;
      font-weight: bold;
      position: absolute;
    }

    #webcam {
      display: none;
    }

    #output-canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* 鏡のように左右反転 */
      display: none;
    }

    /* 検出中の自分の手を表示するタグ */
    .my-hand-badge {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #FF477E;
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 14px;
      font-weight: bold;
      color: #FF477E;
      display: none;
    }

    /* --- 3. 下部：操作ボタンエリア --- */
    .btn-container {
      width: 100%;
      max-width: 300px;
      margin-bottom: 15px;
      text-align: center;
      z-index: 2;
    }

    /* スタートボタン / ぽん！ボタン */
    .action-btn {
      width: 100%;
      padding: 16px 0;
      font-size: 26px;
      font-weight: bold;
      color: #FFFFFF;
      background-color: #FF477E; 
      border: none;
      border-bottom: 6px solid #D62828; 
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: all 0.1s ease;
    }

    .action-btn:active {
      transform: translateY(4px);
      border-bottom: 2px solid #D62828;
    }

    /* 「ぽん！」ボタン用の強調スタイル */
    .action-btn.play-mode {
      background-color: #FF9F1C;
      border-bottom: 6px solid #E57C00;
    }

    /* --- 4. 紙吹雪演出用（JavaScriptでドットを生成） --- */
    .confetti {
      position: absolute;
      width: 12px;
      height: 12px;
      top: -20px;
      z-index: 10;
      border-radius: 3px;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(720deg);
      }
    }
  </style>
</head>
<body>

  <!-- 1. 上部：クマエリア -->
  <div class="character-area">
    <div class="character-emoji" id="bear">🐻</div>
    <div class="enemy-hand-display" id="enemy-hand"></div>
    <div class="message-box" id="message">「スタート」を おしてね！</div>
  </div>

  <!-- 2. 中央：カメラ・Canvasエリア -->
  <div class="camera-container">
    <div class="camera-placeholder" id="placeholder">ボタンを おしてね！</div>
    <video id="webcam" playsinline muted></video>
    <canvas id="output-canvas" width="320" height="240"></canvas>
    <div class="my-hand-badge" id="my-hand-badge">あなたの手: 判定中</div>
  </div>

  <!-- 3. 下部：ボタンエリア -->
  <div class="btn-container">
    <button class="action-btn" id="main-btn">スタート</button>
  </div>

  <!-- --- JavaScript：ロジック＆判定演出 --- -->
  <script>
    const mainBtn = document.getElementById('main-btn');
    const webcam = document.getElementById('webcam');
    const canvasElement = document.getElementById('output-canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const placeholder = document.getElementById('placeholder');
    const message = document.getElementById('message');
    const bear = document.getElementById('bear');
    const enemyHandDisplay = document.getElementById('enemy-hand');
    const myHandBadge = document.getElementById('my-hand-badge');

    let camera = null;
    let currentDetectedHand = 'unknown'; // 現在検知されている手（'rock', 'scissors', 'paper', 'unknown'）
    let isGameStarted = false;

    // 手の骨格線ペア
    const HAND_CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,4],        // 親指
      [0,5],[5,6],[6,7],[7,8],        // 人差し指
      [5,9],[9,10],[10,11],[11,12],   // 中指
      [9,13],[13,14],[14,15],[15,16], // 薬指
      [13,17],[0,17],[17,18],[18,19],[19,20] // 小指・手首
    ];

    // --- 1. じゃんけんの手を判定する関数（指が伸びているか折り曲げられているか） ---
    function detectJankenHand(landmarks) {
      // 各指先（Tips）と関節のY座標を比較して、指が立っているかを判定
      // 画面上ではY座標が小さいほど「上（指が伸びている）」になります
      const isIndexExtended = landmarks[8].y < landmarks[6].y;   // 人差し指
      const isMiddleExtended = landmarks[12].y < landmarks[10].y; // 中指
      const isRingExtended = landmarks[16].y < landmarks[14].y;   // 薬指
      const isPinkyExtended = landmarks[20].y < landmarks[18].y;  // 小指

      // 伸びている指の本数をカウント（人差し指〜小指の4本）
      const extendedFingersCount = [isIndexExtended, isMiddleExtended, isRingExtended, isPinkyExtended].filter(Boolean).length;

      // 判定ロジック
      if (extendedFingersCount >= 3) {
        return 'paper';    // 3本以上指が伸びていたら「パー」
      } else if (isIndexExtended && isMiddleExtended && !isRingExtended && !isPinkyExtended) {
        return 'scissors'; // 人差し指と中指だけ伸びていたら「チョキ」
      } else if (extendedFingersCount === 0) {
        return 'rock';     // 指が1本も伸びていなければ「グー」
      }
      
      return 'unknown';    // それ以外は判定不能
    }

    // --- 2. MediaPipe Handsのセットアップ ---
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    // --- 3. リアルタイム画像解析と骨格描画 ---
    hands.onResults((results) => {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];

        // 手のじゃんけん判定を実行
        currentDetectedHand = detectJankenHand(landmarks);

        // バッジ表示の更新
        const handEmojiMap = { 'rock': '✊ グー', 'scissors': '✌️ チョキ', 'paper': '✋ パー', 'unknown': '❓ 判定中' };
        myHandBadge.textContent = `あなたの手: ${handEmojiMap[currentDetectedHand]}`;

        // 骨格の描画（ピンクの線・黄色の点）
        canvasCtx.strokeStyle = '#FF3399';
        canvasCtx.lineWidth = 5;
        canvasCtx.lineCap = 'round';
        for (const connection of HAND_CONNECTIONS) {
          const from = landmarks[connection[0]];
          const to = landmarks[connection[1]];
          canvasCtx.beginPath();
          canvasCtx.moveTo(from.x * canvasElement.width, from.y * canvasElement.height);
          canvasCtx.lineTo(to.x * canvasElement.width, to.y * canvasElement.height);
          canvasCtx.stroke();
        }

        canvasCtx.fillStyle = '#FFEA00';
        for (const landmark of landmarks) {
          canvasCtx.beginPath();
          canvasCtx.arc(landmark.x * canvasElement.width, landmark.y * canvasElement.height, 6, 0, 2 * Math.PI);
          canvasCtx.fill();
          canvasCtx.strokeStyle = '#FFFFFF';
          canvasCtx.lineWidth = 2;
          canvasCtx.stroke();
        }
      } else {
        currentDetectedHand = 'unknown';
        myHandBadge.textContent = 'てを うつしてね！';
      }

      canvasCtx.restore();
    });

    // --- 4. 紙吹雪を動的に生成する関数 ---
    function createConfetti() {
      const colors = ['#FF477E', '#FFD166', '#06D6A0', '#118AB2', '#FF9F1C'];
      for (let i = 0; i < 50; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
        document.body.appendChild(confetti);

        // アニメーション終了後に要素を削除
        setTimeout(() => confetti.remove(), 3500);
      }
    }

    // --- 5. じゃんけん勝負の実行関数 ---
    function playJanken() {
      if (currentDetectedHand === 'unknown') {
        message.textContent = 'カメラに てを うつしてね！';
        return;
      }

      // クマの手をランダム決定
      const handsList = ['rock', 'scissors', 'paper'];
      const enemyHand = handsList[Math.floor(Math.random() * handsList.length)];

      const emojiMap = { 'rock': '✊', 'scissors': '✌️', 'paper': '✋' };
      enemyHandDisplay.textContent = emojiMap[enemyHand];

      // 勝敗の判定
      if (currentDetectedHand === enemyHand) {
        // あいこ
        bear.textContent = '🐻';
        message.textContent = 'あいこ！ もういっかい！🌀';
      } else if (
        (currentDetectedHand === 'rock' && enemyHand === 'scissors') ||
        (currentDetectedHand === 'scissors' && enemyHand === 'paper') ||
        (currentDetectedHand === 'paper' && enemyHand === 'rock')
      ) {
        // プレイヤーの勝ち
        bear.textContent = '🙌🐻✨';
        message.textContent = 'すごーい！かちだよ！🎉👑';
        createConfetti(); // 紙吹雪エフェクト起動
      } else {
        // プレイヤーの負け（励ます）
        bear.textContent = '🐻';
        message.textContent = 'おしい！ もう一回勝負だ！✊';
      }
    }

    // --- 6. ボタン押下時の処理（起動 ＆ 「ぽん！」判定） ---
    mainBtn.addEventListener('click', async () => {
      // 1回目のタップ：カメラ起動
      if (!isGameStarted) {
        try {
          camera = new Camera(webcam, {
            onFrame: async () => {
              await hands.send({ image: webcam });
            },
            width: 320,
            height: 240,
            facingMode: 'user'
          });

          await camera.start();

          // UIをゲームプレイ用に切り替え
          placeholder.style.display = 'none';
          canvasElement.style.display = 'block';
          myHandBadge.style.display = 'block';

          message.textContent = 'てを かざして「ぽん！」をおしてね！';
          mainBtn.textContent = 'ぽん！ ✊✌️✋';
          mainBtn.classList.add('play-mode');
          
          isGameStarted = true;

        } catch (error) {
          console.error('起動エラー:', error);
          alert('カメラの起動に失敗しました。アクセス許可を確認してください。');
        }
      } else {
        // 2回目以降のタップ：「ぽん！」勝負実行
        playJanken();
      }
    });
  </script>
</body>
</html>
